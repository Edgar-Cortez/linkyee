# Site Configuration

# Theme, mapped to the directory: ./theme/xxxx
theme: default

# HTML Language setting
lang: "en"

# Plugins, implemented in ./plugins/PLUGIN_NAME
# Use {{ vars.PLUGIN_NAME }} in the settings below

# The output of the plugin can be used below, e.g., {{vars.MediumFollowersCountPlugin}}
plugins:
  # Automatically fetch Medium follower count
#   - MediumFollowersCountPlugin:
#       username: zhgchgli
# Automatically fetch Github repo star count
#   - GithubRepoStarsCountPlugin:
#       - ZhgChgLi/ZMarkupParser
#       - ZhgChgLi/ZReviewTender
#       - ZhgChgLi/ZMediumToMarkdown
#       - ZhgChgLi/linkyee

# Google Analytics tracking id
google_analytics_id: "G-M6J9SBDC1F"

# HTML Title
title: "SOLSALT Links"

# Avatar image path
avatar: "./images/SOL SALT - icon.png"

# Name section text
name: "SOLSALT Magnesium"

# Tagline section text
tagline: >
  Topical magnesium for sleep, recovery, and calm.<br>
  Made in Texas, small batch, all natural.<br>
  Reset your body. Fuel your Sol.

# List of links
# icon: Use Font Awesome icons (https://fontawesome.com/search?o=r&m=free)
# text: The displayed text for the link
# title: The url title
# url: The URL of the link
# alt: Alternative text for accessibility
# target: `_blank` opens in a new tab, `_self` opens in the same frame
links:
  - link:
      icon: "fa-solid fa-shop"
      text: "Shop Our Products"
      url: "https://www.thesolsalt.com/discount/welcome10/?utm_source=shop-link&utm_medium=linkyee&utm_campaign=vendor"
      alt: "Sol Salt's Website"
      title: "SolSalt Website"
      target: "_blank"
  - link:
      icon: "fa-solid fa-user-plus"
      text: "Join Our Email List"
      url: "https://www.sendfox.com/lp/1v5w0d"
      alt: "Sol Salt's Email List"
      title: "Sol Salt's Email List"
      target: "_blank"
  - link:
      icon: "fa-brands fa-facebook"
      text: "Facebook"
      url: "https://www.facebook.com/profile.php?id=61566759776296&mibextid=ZbWKwL"
      alt: "Sol Salt's Instagram"
      title: "Sol Salt's Instagram"
      target: "_blank"      
  - link:
      icon: "fa-brands fa-instagram"
      text: "Instagram"
      url: "https://www.instagram.com/solsalt_mag/"
      alt: "Sol Salt's Instagram"
      title: "Sol Salt's Instagram"
      target: "_blank"
  - link:
      icon: "fa-brands fa-tiktok"
      text: "TikTok"
      url: "https://www.tiktok.com/@solsalt_mag/"
      alt: "Sol Salt's TikTok"
      title: "Sol Salt's TikTok"
      target: "_blank"
  - link:
      icon: "fa-solid fa-envelope"
      text: "Email"
      url: "mailto:thesolsalt@gmail.com"
      alt: "Sol Salt's Email"
      title: "Sol Salt's Email"
      target: "_blank"

