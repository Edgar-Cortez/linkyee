# Avatar image path
avatar: "./images/SOL SALT - icon.png"

# Name section text
name: "SOLSALT Magnesium"

# Tagline section text
tagline: >
  Topical magnesium for sleep, recovery, and calm.<br>
  Made in Texas, small batch, all natural.<br>
  Reset your body. Fuel your Sol.

  Late in the third trimester, nothing was working. 
  Leg cramps, poor sleep, general soreness that no one had 
  a real answer for. We started researching topical magnesium 
  and couldn't believe it wasn't already everywhere. We built Sol Salt
  because we needed it — and because we figured we probably weren't alone.

